name: Validate library
on:
  pull_request:
  push:
    branches: [main, feat/reference-library-slice, feat/editorial-inbox, feat/source-monitoring, feat/admin-measurement-settings, feat/local-integration-candidate]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run validate
      - run: npm run staging:check
      - run: PLAYWRIGHT_BROWSERS_PATH=.git/playwright npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:editorial:browser
      - run: npm run test:integration:browser
      - run: npm run test:monitoring:worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
