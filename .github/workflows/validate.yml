name: Validate library
on:
  pull_request:
  push:
    branches: [main, feat/reference-library-slice, feat/editorial-inbox, feat/source-monitoring, feat/admin-measurement-settings, feat/local-integration-candidate]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-trace-analysis:
    if: github.head_ref == 'fix/catalog-seed-atomicity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=.git/playwright npx --no-install playwright install --with-deps chromium
      - name: Inspect original stylesheet timing and loaded snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_BROWSERS_PATH: .git/playwright
        run: node scripts/inspect-original-ci-trace.mjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The upgrade regression executes the exact pre-expansion PR21 code from this repository.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run validate
      - run: npm run staging:check
      - run: PLAYWRIGHT_BROWSERS_PATH=.git/playwright npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:editorial:browser
      - run: npm run test:integration:browser
      - run: npm run test:monitoring:worker
      - run: npm run test:settings:worker
      - run: npm run test:publication:browser
      - run: npm run test:combined:browser
      - run: npm run test:wiki-bridge:browser
      - run: npm run test:wiki-seo:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
